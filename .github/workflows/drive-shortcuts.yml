name: Drive shortcut sync

on:
  workflow_dispatch:
  schedule:
    # The ChatGPT literature organizer runs on the hour.
    # Run 20 minutes later so classification/index updates finish first.
    - cron: "20 * * * *"

permissions:
  contents: read

jobs:
  shortcuts:
    if: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Drive dependencies
        run: pip install -r requirements-drive.txt

      - name: Convert secondary copies to Drive shortcuts
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          LITERATURE_BOX_FOLDER_ID: "1FAbZsNjt0q47KGq3NX2vunckXc3L1CjK"
        run: python drive_shortcuts.py
